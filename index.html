<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MODABERGAMES</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-grid"></div>

  <!-- Minimal Top Status Bar -->
  <header class="topbar">
    <div class="brand">MODABERGAMES</div>

    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search..." autocomplete="off" />
      <kbd>/</kbd>
    </div>

    <div class="topbar-right">
      <span id="clock" class="clock">00:00</span>
    </div>
  </header>

  <!-- Main Workspace Grid -->
  <main class="workspace">
    <div class="games-grid" id="gamesGrid"></div>

    <div class="empty-state hidden" id="emptyState">
      <p id="emptyText">No items added yet.</p>
    </div>
  </main>

  <!-- Floating Lucid-Style Bottom Dock -->
  <nav class="dock-wrapper">
    <div class="dock" id="categoryBar">
      <button class="dock-item active" data-category="all" title="All">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>All</span>
      </button>

      <button class="dock-item" data-category="games" title="Games">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="6" y1="12" x2="10" y2="12"></line>
          <line x1="8" y1="10" x2="8" y2="14"></line>
          <line x1="15" y1="13" x2="15.01" y2="13"></line>
          <line x1="18" y1="11" x2="18.01" y2="11"></line>
          <rect x="2" y="6" width="20" height="12" rx="4"></rect>
        </svg>
        <span>Games</span>
      </button>

      <button class="dock-item" data-category="apps" title="Apps">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>Apps</span>
      </button>

      <button class="dock-item" data-category="ai" title="AI">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
          <circle cx="8" cy="14" r="1"></circle>
          <circle cx="16" cy="14" r="1"></circle>
        </svg>
        <span>AI</span>
      </button>

      <button class="dock-item" data-category="music" title="Music">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>Music</span>
      </button>

      <button class="dock-item" data-category="anime" title="Anime">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
          <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
        <span>Anime</span>
      </button>

      <button class="dock-item" data-category="movies" title="Movies">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <span>Movies</span>
      </button>

      <div class="dock-divider"></div>

      <button class="dock-item" id="favoritesToggle" title="Favorites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span id="favCount">0</span>
      </button>

      <button class="dock-item" id="cloakBtn" title="about:blank">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Cloak</span>
      </button>
    </div>
  </nav>

  <!-- Windowed / Fullscreen Frame Player -->
  <div class="player-overlay hidden" id="playerOverlay">
    <div class="player-window">
      <div class="player-bar">
        <div class="player-info">
          <span class="status-dot"></span>
          <span id="playerGameTitle">Title</span>
        </div>
        <div class="player-actions">
          <button id="playerFavBtn" class="win-btn" title="Favorite">★</button>
          <button id="reloadGameBtn" class="win-btn" title="Reload">↻</button>
          <button id="fullscreenBtn" class="win-btn" title="Fullscreen">⛶</button>
          <button id="closePlayerBtn" class="win-btn close" title="Close">✕</button>
        </div>
      </div>
      <div class="iframe-wrap" id="iframeWrapper">
        <iframe id="gameFrame" src="" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
